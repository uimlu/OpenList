name: Deploy QingLong to Unikraft Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UKC_METRO: sfo
  UKC_ORGANIZATION: mingy
  APP_NAME: qinglong
  APP_IMAGE: index.unikraft.io/mingy/qinglong:latest
  APP_VOLUME: qinglong-data
  UKC_CONFIG: /home/runner/.config/unikraft/config.yaml

jobs:
  deploy-qinglong:
    name: Build and deploy QingLong
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        shell: bash
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -fsSL \
            https://unikraft.com/cli/install.sh | sh

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.unikraft/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$HOME/.unikraft/bin:/usr/local/bin:$PATH"

          if ! command -v unikraft >/dev/null 2>&1; then
            echo "错误：找不到 unikraft CLI"
            echo "当前 PATH：$PATH"
            find "$HOME" -type f -name unikraft -print 2>/dev/null || true
            exit 1
          fi

          echo "Unikraft CLI 安装成功"
          unikraft --help

      - name: Configure Unikraft Cloud
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -e

          if [ -z "$UKC_TOKEN" ]; then
            echo "错误：GitHub Secret UKC_TOKEN 未设置"
            exit 1
          fi

          mkdir -p "$(dirname "$UKC_CONFIG")"

          cat > "$UKC_CONFIG" <<EOF
          profiles:
            default:
              type: cloud
              token: ${UKC_TOKEN}
              organization: ${UKC_ORGANIZATION}
              metros:
                - name: ${UKC_METRO}
                  endpoint: https://api.${UKC_METRO}.unikraft.cloud
                  country: US
          EOF

          chmod 600 "$UKC_CONFIG"

          echo "Unikraft Cloud 配置完成"
          echo "Metro: $UKC_METRO"
          echo "Organization: $UKC_ORGANIZATION"

      - name: Verify Unikraft authentication
        shell: bash
        run: |
          set -e

          echo "正在验证 Unikraft Cloud Token..."

          unikraft \
            --config "$UKC_CONFIG" \
            profile list

          unikraft \
            --config "$UKC_CONFIG" \
            images list

      - name: Clean old AnyRouter image
        shell: bash
        run: |
          set -e

          echo "当前 Registry 镜像："

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            images list

          echo ""
          echo "正在尝试删除旧的 AnyRouter 镜像..."

          # 只删除 AnyRouter 镜像，不删除 OpenList 镜像
          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 10m \
            images delete mingy/anyrouter-check:latest \
            || true

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 10m \
            images delete index.unikraft.io/mingy/anyrouter-check:latest \
            || true

          echo ""
          echo "等待 Registry 更新..."
          sleep 15

          echo ""
          echo "清理后的 Registry 镜像："

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            images list

      - name: Download QingLong source
        uses: actions/checkout@v4
        with:
          repository: whyour/qinglong
          ref: develop
          path: qinglong
          fetch-depth: 1

      - name: Prepare QingLong build context
        shell: bash
        run: |
          set -e

          echo "检查 QingLong 源码..."

          test -d qinglong
          test -f qinglong/docker/Dockerfile
          test -f qinglong/package.json
          test -f qinglong/pnpm-lock.yaml
          test -f qinglong/.npmrc

          echo "正在准备 Dockerfile..."

          # 原 Dockerfile 位于 docker 子目录。
          # 复制到仓库根目录，使构建上下文包含项目根目录文件。
          cp qinglong/docker/Dockerfile qinglong/Dockerfile

          cat > qinglong/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./Dockerfile
            format: erofs
          EOF

          echo "检查构建文件："

          test -f qinglong/Dockerfile
          test -f qinglong/Kraftfile
          test -f qinglong/package.json
          test -f qinglong/pnpm-lock.yaml
          test -f qinglong/.npmrc

          echo ""
          echo "QingLong 目录："
          ls -la qinglong

          echo ""
          echo "Kraftfile 内容："
          cat qinglong/Kraftfile

      - name: Build and push QingLong image
        shell: bash
        run: |
          set -e

          cd qinglong

          echo "正在构建 QingLong 镜像..."
          echo "构建目录：$(pwd)"
          echo "镜像地址：$APP_IMAGE"

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 30m \
            build . \
            --output "$APP_IMAGE"

          echo ""
          echo "QingLong 镜像构建并推送成功"

      - name: Verify QingLong image
        shell: bash
        run: |
          set -e

          echo "正在检查 Registry 中的 QingLong 镜像..."

          IMAGE_LIST="$(
            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 5m \
              images list
          )"

          echo "$IMAGE_LIST"

          if ! echo "$IMAGE_LIST" | grep -Eqi \
            'mingy/qinglong|index\.unikraft\.io/mingy/qinglong'; then
            echo "错误：Registry 中没有找到 QingLong 镜像"
            echo "期望镜像：$APP_IMAGE"
            exit 1
          fi

          echo ""
          echo "镜像确认存在：$APP_IMAGE"

      - name: Create QingLong volume if needed
        shell: bash
        run: |
          set -e

          echo "检查 Volume：$APP_VOLUME"
          echo "Metro：$UKC_METRO"

          if unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            volume get "$APP_VOLUME" \
            >/dev/null 2>&1; then

            echo "Volume $APP_VOLUME 已存在，继续使用"
          else
            echo "正在创建 Volume $APP_VOLUME..."

            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 10m \
              volume create \
              --metro "$UKC_METRO" \
              --name "$APP_VOLUME" \
              --size 1024M

            echo "Volume $APP_VOLUME 创建成功"
          fi

          echo ""
          echo "当前 Volume："

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            volume list

      - name: Delete old QingLong instance only
        shell: bash
        run: |
          set -e

          echo "检查旧的 QingLong 实例..."

          if unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            instance get "$APP_NAME" \
            >/dev/null 2>&1; then

            echo "正在删除旧实例：$APP_NAME"

            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 10m \
              instance delete "$APP_NAME"

            echo "旧 QingLong 实例删除成功"
          else
            echo "没有发现旧的 QingLong 实例"
          fi

          echo ""
          echo "确认保留以下资源："
          echo "- openlist"
          echo "- openlist-data"
          echo "- qinglong-data"

      - name: Deploy QingLong
        shell: bash
        run: |
          set -e

          echo "正在启动 QingLong..."
          echo "Metro: $UKC_METRO"
          echo "Instance: $APP_NAME"
          echo "Image: $APP_IMAGE"
          echo "CPU: 1 vCPU"
          echo "Memory: 2048M"
          echo "Port: 5700"
          echo "Volume: $APP_VOLUME:/ql/data"

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 30m \
            run \
            --metro "$UKC_METRO" \
            --name "$APP_NAME" \
            --image "$APP_IMAGE" \
            --vcpus 1 \
            --memory 2048M \
            --restart always \
            --publish 443:5700/http+tls \
            --volume "$APP_VOLUME:/ql/data" \
            --env "QlBaseUrl=/" \
            --env "QlPort=5700"

          echo ""
          echo "QingLong 实例创建成功"

      - name: Show QingLong instance information
        shell: bash
        run: |
          set -e

          echo "等待实例信息生成..."
          sleep 15

          echo "QingLong 实例信息："

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            instance get "$APP_NAME"

          echo ""
          echo "当前所有实例："

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            instance list

      - name: Get QingLong access URL
        shell: bash
        run: |
          set -e

          echo "正在获取 QingLong 访问地址..."

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            instance get "$APP_NAME" \
            --output json \
            > qinglong-instance.json

          echo "实例 JSON："
          cat qinglong-instance.json

          FQDN="$(
            jq -r '
              .. |
              objects |
              .fqdn? //
              empty
            ' qinglong-instance.json |
            grep -m 1 -E '\.unikraft\.app$' || true
          )"

          if [ -n "$FQDN" ]; then
            URL="https://$FQDN"

            echo ""
            echo "========================================="
            echo "QingLong 部署成功"
            echo "访问地址：$URL"
            echo "========================================="

            {
              echo "## QingLong 部署成功"
              echo ""
              echo "**访问地址：[$URL]($URL)**"
              echo ""
              echo "- Metro：\`$UKC_METRO\`"
              echo "- Instance：\`$APP_NAME\`"
              echo "- CPU：1 vCPU"
              echo "- Memory：2048M"
              echo "- Port：5700"
              echo "- Volume：\`$APP_VOLUME:/ql/data\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo ""
            echo "实例已经创建，但暂时没有自动获取到 FQDN"
            echo "请查看上方 instance list 输出中的访问地址"

            {
              echo "## QingLong 实例已创建"
              echo ""
              echo "暂时没有自动获取到访问地址，请查看 Actions 日志中的 FQDN。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
