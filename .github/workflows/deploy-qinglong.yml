name: Deploy QingLong to Unikraft Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UKC_METRO: sfo
  UKC_ORGANIZATION: mingy
  APP_NAME: qinglong
  APP_IMAGE: index.unikraft.io/mingy/qinglong:latest
  APP_VOLUME: qinglong-data
  UKC_CONFIG: /home/runner/.config/unikraft/config.yaml

jobs:
  deploy-qinglong:
    name: Build and deploy QingLong
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        shell: bash
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -fsSL \
            https://unikraft.com/cli/install.sh | sh

          export PATH="$HOME/.local/bin:$HOME/.unikraft/bin:/usr/local/bin:$PATH"

          if ! command -v unikraft >/dev/null 2>&1; then
            echo "错误：找不到 unikraft CLI"
            echo "PATH=$PATH"
            find "$HOME" -type f -name unikraft -print 2>/dev/null || true
            exit 1
          fi

          unikraft --help

      - name: Add Unikraft CLI to PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.unikraft/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Configure Unikraft Cloud profile
        shell: bash
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          set -e

          if [ -z "$UKC_TOKEN" ]; then
            echo "错误：GitHub Secret UKC_TOKEN 未设置"
            exit 1
          fi

          mkdir -p "$(dirname "$UKC_CONFIG")"

          cat > "$UKC_CONFIG" <<EOF
          profiles:
            default:
              type: cloud
              token: ${UKC_TOKEN}
              organization: ${UKC_ORGANIZATION}
              metros:
                - name: ${UKC_METRO}
                  endpoint: https://api.${UKC_METRO}.unikraft.cloud
                  country: US
          EOF

          chmod 600 "$UKC_CONFIG"

          echo "Unikraft 配置已创建"
          echo "Metro: $UKC_METRO"
          echo "Organization: $UKC_ORGANIZATION"

      - name: Check Unikraft authentication
        shell: bash
        run: |
          set -e

          unikraft \
            --config "$UKC_CONFIG" \
            profile list

          unikraft \
            --config "$UKC_CONFIG" \
            images list

      - name: Download QingLong source
        uses: actions/checkout@v4
        with:
          repository: whyour/qinglong
          ref: develop
          path: qinglong
          fetch-depth: 1

      - name: Prepare QingLong Unikraft build files
        shell: bash
        run: |
          set -e

          test -d qinglong
          test -f qinglong/docker/Dockerfile

          cat > qinglong/Kraftfile <<'EOF'
          spec: v0.7

          runtime: base-compat:latest

          rootfs:
            source: ./docker/Dockerfile
            format: erofs
          EOF

          echo "QingLong 目录："
          ls -la qinglong

          echo "Dockerfile："
          test -f qinglong/docker/Dockerfile

          echo "Kraftfile："
          cat qinglong/Kraftfile

      - name: Build and push QingLong image
        shell: bash
        run: |
          set -e

          cd qinglong

          echo "正在构建 QingLong 镜像..."
          echo "构建目录：$(pwd)"
          echo "镜像地址：${APP_IMAGE}"

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 30m \
            build . \
            --output "$APP_IMAGE"

          echo "镜像构建和推送命令已完成"

      - name: Verify QingLong image exists
        shell: bash
        run: |
          set -e

          echo "正在检查镜像是否已经推送到 Unikraft Registry..."

          IMAGE_LIST="$(
            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 5m \
              images list
          )"

          echo "$IMAGE_LIST"

          if ! echo "$IMAGE_LIST" | grep -Eqi \
            'mingy/qinglong|index\.unikraft\.io/mingy/qinglong'; then
            echo "错误：镜像没有出现在 Registry 中"
            echo "期望镜像：$APP_IMAGE"
            exit 1
          fi

          echo "镜像确认存在：$APP_IMAGE"

      - name: Create QingLong volume if needed
        shell: bash
        run: |
          set -e

          echo "检查 Volume：$APP_VOLUME"
          echo "Metro：$UKC_METRO"

          if unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            volumes get "$APP_VOLUME" \
            >/dev/null 2>&1; then

            echo "Volume $APP_VOLUME 已存在，继续使用"
          else
            echo "正在创建 Volume $APP_VOLUME..."

            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 10m \
              volume create \
              --metro "$UKC_METRO" \
              --name "$APP_VOLUME" \
              --size 1024M

            echo "Volume 创建成功"
          fi

          echo "当前 Volume 列表："

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            volumes list

      - name: Remove old QingLong instance only
        shell: bash
        run: |
          set -e

          echo "检查旧的 QingLong 实例..."

          if unikraft \
            --config "$UKC_CONFIG" \
            --timeout 5m \
            instances get "$APP_NAME" \
            >/dev/null 2>&1; then

            echo "正在删除旧实例：$APP_NAME"

            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 10m \
              instances delete "$APP_NAME"

            echo "旧 QingLong 实例已删除"
          else
            echo "没有发现旧的 QingLong 实例"
          fi

          echo "不会删除以下资源："
          echo "- openlist"
          echo "- openlist-data"

      - name: Deploy QingLong
        shell: bash
        run: |
          set -e

          echo "正在启动 QingLong..."
          echo "Metro: $UKC_METRO"
          echo "Instance: $APP_NAME"
          echo "Image: $APP_IMAGE"
          echo "CPU: 1 vCPU"
          echo "Memory: 2048M"
          echo "Volume: $APP_VOLUME:/ql/data"

          unikraft \
            --config "$UKC_CONFIG" \
            --timeout 30m \
            run \
            --metro "$UKC_METRO" \
            --name "$APP_NAME" \
            --image "$APP_IMAGE" \
            --vcpus 1 \
            --memory 2048M \
            --restart always \
            --publish 443:5700/http+tls \
            --volume "$APP_VOLUME:/ql/data" \
            --env "QlBaseUrl=/" \
            --env "QlPort=5700"

      - name: Get QingLong access URL
        shell: bash
        run: |
          set -e

          echo "等待实例信息生成..."
          sleep 10

          echo "当前实例列表："

          INSTANCE_LIST="$(
            unikraft \
              --config "$UKC_CONFIG" \
              --timeout 5m \
              instances list
          )"

          echo "$INSTANCE_LIST"

          FQDN="$(
            echo "$INSTANCE_LIST" |
            awk -v app="$APP_NAME" '
              $0 ~ app {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /\.unikraft\.app$/) {
                    print $i
                    exit
                  }
                }
              }
            '
          )"

          if [ -n "$FQDN" ]; then
            URL="https://$FQDN"

            echo ""
            echo "========================================="
            echo "QingLong 部署成功"
            echo "访问地址：$URL"
            echo "========================================="

            {
              echo "## QingLong 部署成功"
              echo ""
              echo "**访问地址：[$URL]($URL)**"
              echo ""
              echo "- Metro：\`$UKC_METRO\`"
              echo "- Instance：\`$APP_NAME\`"
              echo "- CPU：1 vCPU"
              echo "- Memory：2048M"
              echo "- Volume：\`$APP_VOLUME:/ql/data\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "实例已经创建，但暂时没有获取到 FQDN"
            echo "请稍等后在实例列表中查看访问地址"

            {
              echo "## QingLong 已创建"
              echo ""
              echo "暂时没有自动获取到访问地址，请查看上方实例列表。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
